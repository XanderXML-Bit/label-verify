name: Vercel preview URL comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  comment-preview-url:
    name: Post predicted Vercel preview URL
    runs-on: ubuntu-latest
    steps:
      - name: Explain how to request a preview
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Request a Vercel preview

            If you need a preview, post `[preview] label-verify ${{ github.event.pull_request.head.sha }}`.
            Use the deployment URL that the release operator posts for that commit.
          edit-mode: replace
